# Tests on every push and pull request (public Iron Owl repository only).
#
# Actions are pinned to full commit SHAs (a tag can be moved; a SHA can't), with the tag in a
# comment. To update one: look up the new tag's commit, read-only, e.g.
#   gh api repos/actions/checkout/git/ref/tags/v4.4.0 --jq .object
# (if "type" is "tag", get its commit with gh api repos/actions/checkout/git/tags/<sha> --jq .object.sha),
# then replace the SHA and the comment here and in the other workflow.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository == 'iron-owl-app/Iron-Owl'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python packages
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -p no:cacheprovider --basetemp "$env:RUNNER_TEMP\pytest-backend" -rfE

      - name: Launcher tests
        working-directory: packaging/launcher
        run: python -m pytest -p no:cacheprovider --basetemp "$env:RUNNER_TEMP\pytest-launcher" -rfE tests

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Repo map is up to date
        run: python tools/repo_map.py --check
