<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Iron Owl</title>
    <!-- The window's title bar color: the page background (--bg) in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e14" />
    <!-- The saved theme (Light / Dark / Warm night) before anything paints; a file, not inline (CSP). -->
    <script src="/theme-boot.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/boot.css" />
  </head>
  <body>
    <div id="root">
      <!-- "Starting FinTrack…" before any script runs; React replaces it (see public/boot.css). -->
      <div class="ft-boot">
        <svg class="ft-boot-logo" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
          <rect width="512" height="512" rx="116" fill="#F2A30F" />
          <path fill="#2D3540" d="M158 108 L208 150 Q256 140 304 150 L354 108 Q368 100 370 118 L374 210 Q440 290 414 378 Q382 456 256 458 Q130 456 98 378 Q72 290 138 210 L142 118 Q144 100 158 108 Z" />
          <circle cx="196" cy="242" r="64" fill="#F6F8FA" /><circle cx="316" cy="242" r="64" fill="#F6F8FA" />
          <circle cx="202" cy="248" r="32" fill="#2D3540" /><circle cx="310" cy="248" r="32" fill="#2D3540" />
          <circle cx="214" cy="236" r="11" fill="#FFFFFF" /><circle cx="322" cy="236" r="11" fill="#FFFFFF" />
          <path fill="#F2A30F" d="M242 296 Q256 290 270 296 L259 318 Q256 323 253 318 Z" />
          <ellipse cx="256" cy="388" rx="74" ry="56" fill="#DDE3EA" />
          <circle cx="256" cy="378" r="17" fill="#2D3540" />
          <path fill="#2D3540" d="M248 386 L264 386 L270 416 L242 416 Z" />
          <ellipse cx="218" cy="458" rx="22" ry="12" fill="#2D3540" /><ellipse cx="294" cy="458" rx="22" ry="12" fill="#2D3540" />
        </svg>
        <div role="status" aria-live="polite">
          <p class="ft-boot-name">Iron Owl</p>
          <p class="ft-boot-msg">Starting Iron Owl…</p>
        </div>
        <div class="ft-boot-bar" aria-hidden="true"><span></span></div>
        <p class="ft-boot-hint">This usually takes a few seconds.</p>
        <p class="ft-boot-late">Iron Owl didn’t open. Close this window and open Iron Owl again from the desktop icon.</p>
        <noscript>
          <p class="ft-boot-noscript">Iron Owl can’t open in this window. Close this window and open Iron Owl again from the desktop icon.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
